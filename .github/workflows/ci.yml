name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check index.js lib/*.js companion/*.js
      - name: Build client artifact
        run: node build-client.mjs
      - name: Verify generated client is committed
        run: git diff --exit-code -- client.js
      - name: Tests
        run: node --test tests/*.test.mjs
